const SBT={full:{v:"--sb-f",ds:"solid",t:"إخوان (أب وأم)"},pa:{v:"--sb-p",ds:"dashed",t:"إخوان من الأب فقط"},ma:{v:"--sb-m",ds:"dashed",t:"إخوان من الأم فقط"},mk:{v:"--sb-r",ds:"dotted",t:"🍼 إخوان بالرضاعة"}};
const sibTag=(k,s)=>(k.sex==="F"?"أخت":"أخ")+(s==="pa"?" لأب":s==="ma"?" لأم":s==="mk"?" بالرضاعة":s==="ad"?" بالتبني":"");
function sibGroups(p){const g={full:[],pa:[],ma:[],mk:[]},seen=new Set([p.code]),fa=p.father,mo=p.mother;
 Object.values(P).forEach(q=>{if(q.code===p.code)return;const fs=fa&&q.father?(fa===q.father?1:0):-1,ms=mo&&q.mother?(mo===q.mother?1:0):-1;let k=null;
  if(fs===1&&ms===1)k="full";else if(fs===1&&ms===0)k="pa";else if(ms===1&&fs===0)k="ma";else if((fs===1&&ms===-1)||(ms===1&&fs===-1))k="full";
  if(k){g[k].push(q);seen.add(q.code)}});
 const me=p.milk.filter(m=>P[m]);
 Object.values(P).forEach(q=>{if(seen.has(q.code))return;if(q.milk.some(h=>me.includes(h))||(me.includes(q.mother)&&(!p.ms||p.ms.includes(q.code)))||(p.mother&&q.milk.includes(p.mother)&&(!q.ms||q.ms.includes(p.code))))g.mk.push(q)});
 return["full","pa","ma","mk"].map(s=>({s,...SBT[s],items:srt(g[s])})).filter(x=>x.items.length)}
function sibCard(G){if(!G.length)return"";return`<div class="cd"><b>الإخوة والأخوات</b>${G.map(g=>`<div style="margin-top:12px"><span class="bg" style="margin:0;background:none;border:1.5px ${g.ds} var(${g.v});color:var(${g.v})">${g.t} · ${g.items.length}</span>${g.items.map(k=>`<div class="li" style="border-inline-start:4px ${g.ds} var(${g.v});padding-inline-start:10px;margin-top:6px" onclick="detail('${k.code}')"><span>${E(k.name)}<small class="mu" style="margin-inline-start:6px">${sibTag(k,g.s)}</small></span><span>‹</span></div>`).join("")}</div>`).join("")}</div>`}

function detail(c){const p=P[c];if(!p)return;sel=c;
 if(p.masked)return scr(E(p.name),`<div class="cd"><span class="bg ${p.dead?"dead":"alive"}">${p.dead?"متوفاة":p.unk?"غير معروف":"حي"}</span><span class="bg sx">أنثى</span></div>${mhdCard()}`,`<button class="btn o" onclick="home();tab='tree';egoGo('${c}')">عرض في الشجرة</button>`);const f=P[p.father||p.mother],SG=sibGroups(p),sb=SG.flatMap(g=>g.items.map(k=>({k,g}))),ch=kids(c);
 scr(E(p.name),`<div class="cd"><span class="bg ${p.dead?"dead":"alive"}">${p.dead?(p.sex==="F"?"متوفاة":"متوفى"):p.unk?"غير معروف":"حي"}</span><span class="bg sx">${p.sex==="F"?"أنثى":"ذكر"}</span><span class="mu">#${c}</span><div class="mu" style="margin-top:8px">الاسم الكامل</div><b style="font-size:17px">${E(full(c))}</b>${extraInfo(p)}</div>${contactCard(p)}${sumCard(c)}${miniCard(c)}${sibCard(SG)}${extraCards(p)}${ch.length?`<div class="cd"><div style="display:flex;justify-content:space-between;align-items:center"><b>الأبناء</b>${ch.length>1?`<button class="btn o" style="width:auto;padding:6px 12px" onclick="ordScr('${c}')">ترتيب الأبناء</button>`:""}</div>${ch.map(k=>`<div class="li" onclick="detail('${k.code}')">${E(k.name)}<span>‹</span></div>`).join("")}</div>`:""}`,`<button class="btn" onclick="edit('${c}')">تعديل البيانات</button><button class="btn o" onclick="home();tab='tree';egoGo('${c}')">عرض في الشجرة</button>`)}

label>الدولة (اختياري)</label><input id="ec" value="${E(p.country||"")}"><label>الفرع (اختياري)</label><input id="ef" value="${E(p.branch||"")}"><label>اللقب (اختياري)</label><input id="el" value="${E(p.nick||"")}"><label>النبذة (اختياري)</label><textarea id="eg" rows="4">${E(p.bio||"")}</textarea></div><div id="q2" class="cd" hidden>${spBody(c)}</div>`,`<button class="btn" onclick="review('${c}')">مراجعة التعديلات</button>`)}

let PS={f:"",m:""};
function pb(k,p,c){const F=k==="f",w=F?"الأب":"الأم",cur=F?p.father:p.mother,code=p[k+"c"]!==undefined?p[k+"c"]:(P[cur]?cur:""),mode=p[k+"m"]||(code?"y":"n"),nm=p[k+"n"]!==undefined?p[k+"n"]:"";PS[k]=code;
 return `<div class="pbk" data-k="${k}"><label>هل ${w} موجود${F?"":"ة"} في الشجرة؟</label><div class="row"><label class="opt" style="flex:1;margin:0;padding:9px"><input type="radio" name="pm${k}" value="y"${mode==="y"?" checked":""} onchange="pmode('${k}')">نعم</label><label class="opt" style="flex:1;margin:0;padding:9px"><input type="radio" name="pm${k}" value="n"${mode==="n"?" checked":""} onchange="pmode('${k}')">لا</label></div>
 <div id="pY${k}"${mode==="y"?"":" hidden"}><input id="pq${k}" placeholder="اكتب اسم ${w} للبحث" oninput="pFind('${k}','${c}',this.value)"><div id="pl${k}"></div><div id="pc${k}" class="mu" style="margin-top:6px">${code?"المختار: "+E(full(code)):"لم يتم اختيار "+w}</div></div>
 <div id="pN${k}"${mode==="n"?"":" hidden"}><input id="pn${k}" placeholder="اكتب اسم ${w} (اختياري)" value="${E(nm)}"></div></div>`}
function pRead(){const o={};["f","m"].forEach(k=>{const r=document.querySelector(`input[name=pm${k}]:checked`),y=!!r&&r.value==="y";o[k+"m"]=y?"y":"n";o[k+"c"]=y?(PS[k]||""):"";o[k+"n"]=y?"":((document.getElementById("pn"+k)||{}).value||"").trim()});return o}

function pFind(k,c,v){const e=$("pl"+k);v=(v||"").trim();if(!v){e.innerHTML="";return}const sx=k==="f"?"M":"F",ks=kids(c).map(x=>x.code);
 const l=Object.values(P).filter(x=>x.code!==c&&!ks.includes(x.code)&&x.sex===sx&&((x.name||"").includes(v)||full(x.code).includes(v))).sort(rk(v)).slice(0,40);
 e.innerHTML=l.map(x=>`<div class="li" onclick="pPick('${k}','${x.code}')"><span>${E(full(x.code))}</span></div>`).join("")||'<div class="mu" style="padding:8px">لا نتائج</div>'}

/* ===== ملء الشاشة وتثبيت التطبيق ===== */
let DEFI=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEFI=e});
const isApp=()=>{try{return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true}catch(e){return false}};
function fsGo(){try{if(document.fullscreenElement){document.exitFullscreen()}else{document.documentElement.requestFullscreen({navigationUI:"hide"}).catch(()=>toast("المتصفح لم يسمح بملء الشاشة"))}}catch(e){toast("المتصفح لا يدعم ملء الشاشة")}}
function pwaGo(){if(DEFI){DEFI.prompt();DEFI=null}}
function fsSheet(){
 const can=!!document.fullscreenEnabled,app=isApp();
 scr("ملء الشاشة وتثبيت التطبيق",

  (!can&&!DEFI&&!app?'<div class="mu">متصفحك لا يفتح ملء الشاشة من داخل الصفحة، استخدم الإضافة للشاشة الرئيسية بالأسفل.</div>':"")+'</div>'+
  '<div class="cd"><h3>لتظهر الشجرة بدون شريط المتصفح</h3>'+
  '<div class="li"><span><b>آيفون (Safari)</b><br><small class="mu">اضغط زر المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية»</small></span></div>'+
  '<div class="li"><span><b>أندرويد (Chrome)</b><br><small class="mu">اضغط القائمة ⋮ ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»</small></span></div>'+
  '<div class="mu" style="margin-top:8px">بعدها افتحه من الأيقونة على شاشتك، وسيظهر كتطبيق كامل.</div></div>')}

/* ===== إرشادات الاستخدام السريعة ===== */
const QG=[
 ["👆","اضغط على أي اسم","تظهر بيانات الشخص وأقاربه، ويصير مركز الشجرة."],
 ["⋮","النقاط الثلاث بجانب الاسم","قائمة الخيارات: عرض، تعديل، إضافة ابن أو زوج أو والد، ترتيب الأبناء، حذف."],
 ["🖐","تحرّك في الشجرة","اسحب بإصبعك، وكبّر وصغّر من الأزرار الجانبية. يمكنك إخفاءها بزر ✕ وإظهارها بزر ⚙ الأزرار."],
 ["🔍","ابحث عن أي فرد","اضغط أيقونة البحث واكتب الاسم للوصول إليه مباشرة."],
 ["☰","القائمة","فيها صلة الرحم وحاسبة القرابة والإحصائيات وتصدير الشجرة كصورة والإعدادات."],
 ["‹ ›","رجوع وتقدم","الشريط السفلي يعيدك للأشخاص الذين فتحتهم قبل قليل."],
 ["⛶","ملء الشاشة","من القائمة ← «ملء الشاشة وتثبيت التطبيق» ليظهر بدون شريط المتصفح."]];
function qGuide(auto){
 let g=document.getElementById("qg");if(!g){g=document.createElement("div");g.id="qg";g.hidden=true;document.body.appendChild(g)}
 g.innerHTML='<div class="qb"><h2>طريقة الاستخدام 💡</h2><div class="mu" style="margin-bottom:6px">'+(auto?"مرحباً بك! هذه أهم الأشياء في دقيقة واحدة:":"أهم ما تحتاجه في دقيقة واحدة:")+'</div>'+
  QG.map(q=>'<div class="qs"><div class="qi">'+q[0]+'</div><div><b>'+q[1]+'</b><span>'+q[2]+'</span></div></div>').join("")+
  '<div style="height:10px"></div><button class="btn" onclick="qgClose()">فهمت، ابدأ</button><div style="height:8px"></div><button class="btn o" onclick="qgClose();helpSheet()">جولة تفصيلية بكل المزايا</button></div>';
 g.hidden=false}
function qgClose(){const g=document.getElementById("qg");if(g)g.hidden=true;try{localStorage.setItem("qg9","1")}catch(e){}}
let QGD=false;
function qgAuto(){if(QGD)return;let seen=false;try{seen=!!localStorage.getItem("qg9")}catch(e){}
 if(seen){QGD=true;return}

/* ===== صلة الرحم: حفظ سحابي حتى تبقى العلامات مع نفس الاسم من أي جهاز ===== */
let RSU=null,RSM=null,RSL=0,RSF=0;
const rcK=k=>k.slice(ME.length+1).replace("|","_"),rlK=c=>ME+"|"+c.replace("_","|");
function rahmFail(){if(!RSF){RSF=1;toast("تعذّر حفظ صلة الرحم على السحابة، سيبقى محفوظاً في هذا المتصفح فقط")}}
function rahmPush(){
 if(!DB||!ME)return;
 const all=rld(),o={};Object.keys(all).forEach(k=>{if(k.indexOf(ME+"|")===0&&all[k]&&Object.keys(all[k]).length)o[rcK(k)]=all[k]});
 RSL=Date.now();
 try{Promise.resolve(DB.doc("meta/rahm_"+ME).set(o)).catch(rahmFail)}catch(e){rahmFail()}}
function rahmSync(){
 if(!DB||!ME||RSM===ME)return;RSM=ME;RSU&&RSU();let first=true;
 try{RSU=DB.doc("meta/rahm_"+ME).onSnapshot(s=>{try{
  if(Date.now()-RSL<2500)return;
  const v=(s&&typeof s.data==="function"?s.data():s)||{},ks=Object.keys(v),all=rld();
  if(!ks.length){if(first){first=false;if(Object.keys(all).some(k=>k.indexOf(ME+"|")===0))rahmPush()}return}
  first=false;
  Object.keys(all).forEach(k=>{if(k.indexOf(ME+"|")===0)delete all[k]});
  ks.forEach(c=>{if(v[c]&&typeof v[c]==="object")all[rlK(c)]=v[c]});
  rsv(all);
  const e=$("scr");if(e&&!e.hidden&&e.textContent.includes("تمّت صلة"))rahmDraw();
 }catch(e){}},()=>{})}catch(e){}}

(function(){const r=render;render=function(){const v=r.apply(this,arguments);try{zbDecor()}catch(e){}try{rahmSync()}catch(e){}try{qgAuto()}catch(e){}return v}})();
</script>
<script id="scr-zoom-js">
/* الشاشات الكاملة (ترتيب الأبناء، تعديل الفرد، التفاصيل...): ترجع للحجم الطبيعي تلقائياً وتبقى مثبّتة طول فتحها، ثم يرجع التكبير بالأصابع */
(function(){
 const vp=window.visualViewport,mv=document.querySelector('meta[name="viewport"]'),es=document.getElementById("scr");
 if(!es)return;
 const base=mv?mv.getAttribute("content"):"";let locked=false;
 const lock=()=>{if(mv&&!locked){locked=true;mv.setAttribute("content",base+",minimum-scale=1,maximum-scale=1,user-scalable=no")}};
 const unlock=()=>{if(mv&&locked){locked=false;mv.setAttribute("content",base)}};
 function fit(){
  try{
   if(!vp)return;
   if(es.hidden||vp.scale<=1.02){es.style.inset="";es.style.width="";es.style.height="";es.style.transform="";es.style.transformOrigin="";return}
   const de=document.documentElement;
   es.style.inset="0 auto auto 0";es.style.width=de.clientWidth+"px";es.style.height=de.clientHeight+"px";
   es.style.transformOrigin="0 0";es.style.transform="translate("+vp.offsetLeft+"px,"+vp.offsetTop+"px) scale("+(1/vp.scale)+")"
  }catch(e){}}
 function sync(){if(es.hidden){unlock();fit()}else{lock();fit();setTimeout(fit,150);setTimeout(fit,500)}}
 const d0=drawScr;
 drawScr=function(){const r=d0.apply(this,arguments);sync();return r};
 if(vp){vp.addEventListener("resize",fit);vp.addEventListener("scroll",fit)}
 new MutationObserver(sync).observe(es,{attributes:true,attributeFilter:["hidden"]});
})();
</script>
